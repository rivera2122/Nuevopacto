<title>Nuevo Pacto Apopa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Iglesia Cristiana Nuevo Pacto Apopa, El Salvador. Horarios de servicio, mensajes, ministerios y cómo visitarnos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Figtree:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@1,8..60,400;1,8..60,500&display=swap">
<style id="site-css">
/* Layout: portada con carrusel de fotos sobre amanecer y volcán; bandas alternas claras/azul profundo; horarios como semana; panel de administración en #admin. */
:root {
  --ink: #0d1b3d; --ink-soft: #3a4766; --paper: #f6f7fb; --surface: #ffffff; --line: #d9deea;
  --blue: #1846b8; --blue-deep: #0b2a78; --gold: #e8a320; --gold-soft: #fff1d3;
  --on-deep: #f2f5ff; --on-deep-soft: #b9c5e8; --danger: #b3261e; --ok: #1d7a46;
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --verse: "Source Serif 4", Georgia, "Times New Roman", serif;
  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #e8ecf8; --ink-soft: #a9b4d0; --paper: #0a1128; --surface: #111a38; --line: #243056;
    --blue: #7ea2ff; --blue-deep: #061646; --gold: #f2b542; --gold-soft: #2a2210;
    --on-deep: #f2f5ff; --on-deep-soft: #a9b8e6; --danger: #ff8a80; --ok: #6fd69a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #e8ecf8; --ink-soft: #a9b4d0; --paper: #0a1128; --surface: #111a38; --line: #243056;
  --blue: #7ea2ff; --blue-deep: #061646; --gold: #f2b542; --gold-soft: #2a2210;
  --on-deep: #f2f5ff; --on-deep-soft: #a9b8e6; --danger: #ff8a80; --ok: #6fd69a; color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { animation: none !important; transition: none !important; } }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--blue-deep); }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; border-radius: 4px; }
.wrap { max-width: 1160px; margin: 0 auto; padding-left: var(--gut-l); padding-right: var(--gut-r); }
h1, h2, h3 { font-family: var(--display); line-height: 1.05; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h2 { font-size: clamp(2rem, 4.4vw, 3.2rem); font-weight: 800; font-stretch: 112%; }
h3 { font-size: 1.25rem; font-weight: 700; font-stretch: 105%; }
p { margin: 0; }
.eyebrow { font-family: var(--display); font-size: .8rem; font-weight: 700; font-stretch: 120%; letter-spacing: .14em; text-transform: uppercase; color: var(--blue); }
.sec-title { margin-top: 14px; }
section { padding-block: clamp(64px, 9vw, 112px); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5em; padding: .85em 1.4em; border-radius: 999px; font-weight: 700; font-size: .98rem; text-decoration: none; border: 2px solid transparent; transition: transform .15s ease, background .15s ease; cursor: pointer; font-family: var(--body); }
.btn:hover { transform: translateY(-2px); }
.btn:disabled { opacity: .5; cursor: default; transform: none; }
.btn-gold { background: var(--gold); color: #1b1300; }
.btn-ghost { border-color: currentColor; color: var(--on-deep); background: transparent; }
.btn-blue { background: var(--blue-deep); color: #fff; }
.btn-line { border-color: var(--line); color: var(--ink); background: transparent; }
:root[data-theme="dark"] .btn-blue { background: var(--blue); color: #061646; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn-blue { background: var(--blue); color: #061646; } }

/* Encabezado */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--blue-deep); color: var(--on-deep); }
.nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 68px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--on-deep); }
.brand-mark { width: 40px; height: 40px; flex: none; }
.brand-name { font-family: var(--display); font-weight: 800; font-stretch: 118%; font-size: 1.05rem; line-height: 1; letter-spacing: .02em; text-transform: uppercase; }
.brand-name small { display: block; font-weight: 500; font-stretch: 100%; font-size: .72rem; letter-spacing: .22em; color: var(--on-deep-soft); margin-top: 4px; }
.menu { display: flex; align-items: center; gap: 4px; list-style: none; margin: 0; padding: 0; }
.menu a { display: block; padding: .5em .8em; text-decoration: none; font-weight: 600; font-size: .95rem; border-radius: 8px; }
.menu a:hover { background: rgba(255,255,255,.08); }
.menu .give { background: var(--gold); color: #1b1300; border-radius: 999px; padding: .5em 1.1em; margin-left: 6px; }
.menu-btn { display: none; background: none; border: 2px solid rgba(255,255,255,.3); color: var(--on-deep); border-radius: 10px; padding: 8px 12px; font: 600 .9rem var(--body); cursor: pointer; }
@media (max-width: 880px) {
  .menu-btn { display: block; }
  .menu { position: absolute; left: 0; right: 0; top: 100%; flex-direction: column; align-items: stretch; gap: 0; background: var(--blue-deep); padding: 8px var(--gut-r) 20px var(--gut-l); border-top: 1px solid rgba(255,255,255,.1); }
  .menu a { padding: .9em .4em; font-size: 1.05rem; }
  .menu .give { margin: 10px 0 0; text-align: center; }
  .menu:not(.open) { display: none; }
}

/* Portada con carrusel */
.hero { position: relative; overflow: hidden; color: var(--on-deep); background: linear-gradient(180deg, #071a52 0%, #123a9e 46%, #3f62c4 64%, #e9a447 88%, #f7c66c 100%); padding-block: 0; }
.slides { position: absolute; inset: 0; z-index: 0; }
.slide { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.4s ease; transform: scale(1.06); }
.slide.on { opacity: 1; animation: drift 9s ease-out both; }
@keyframes drift { from { transform: scale(1.06); } to { transform: scale(1); } }
.hero.has-photos .slides::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(5,16,52,.88) 0%, rgba(8,28,90,.62) 50%, rgba(8,28,90,.25) 100%), linear-gradient(0deg, rgba(5,16,52,.75) 0%, transparent 45%); }
.hero.has-photos svg.scene { opacity: .0; }
.hero-inner { position: relative; z-index: 2; padding-top: clamp(56px, 9vw, 110px); padding-bottom: clamp(200px, 26vw, 300px); max-width: 1160px; margin: 0 auto; padding-left: var(--gut-l); padding-right: var(--gut-r); }
.hero .eyebrow { color: var(--gold); }
.hero h1 { font-size: clamp(2.7rem, 8.2vw, 6.4rem); font-weight: 900; font-stretch: 116%; letter-spacing: -0.02em; margin-top: 18px; max-width: 13ch; }
.hero h1 em { font-style: normal; color: var(--gold); }
.hero-sub { font-size: clamp(1.05rem, 1.6vw, 1.25rem); max-width: 46ch; margin-top: 22px; color: #dfe6ff; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
.hero svg.scene { position: absolute; left: 0; right: 0; bottom: -1px; width: 100%; height: clamp(180px, 24vw, 300px); z-index: 1; transition: opacity .6s; }
.sun { animation: rise 2.4s cubic-bezier(.2,.7,.2,1) both; }
@keyframes rise { from { transform: translateY(40px); } to { transform: translateY(0); } }
.hero-verse { position: absolute; z-index: 2; right: var(--gut-r); bottom: 28px; max-width: 30ch; text-align: right; font-family: var(--verse); font-style: italic; font-size: 1rem; color: #fff; text-shadow: 0 1px 8px rgba(0,0,0,.35); }
.hero-verse b { display: block; font-family: var(--body); font-style: normal; font-weight: 700; font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; margin-top: 6px; }
.dots { position: absolute; z-index: 3; left: var(--gut-l); bottom: 28px; display: flex; gap: 8px; }
.dots button { width: 28px; height: 4px; border-radius: 2px; border: 0; padding: 0; background: rgba(255,255,255,.35); cursor: pointer; }
.dots button.on { background: var(--gold); }
@media (max-width: 640px) { .hero-verse { left: var(--gut-l); right: var(--gut-r); text-align: left; max-width: none; bottom: 18px; } .dots { bottom: auto; top: 18px; left: auto; right: var(--gut-r); } }

/* Bienvenida */
.welcome-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: clamp(32px, 6vw, 80px); align-items: center; }
.welcome-grid > * { min-width: 0; }
.welcome p.lead { font-size: 1.15rem; color: var(--ink-soft); margin-top: 22px; max-width: 58ch; }
.welcome p.lead + p.lead { margin-top: 14px; }
.welcome p.lead strong { color: var(--ink); }
.welcome .btn { margin-top: 28px; }
.pillars { display: grid; border-top: 2px solid var(--ink); }
.pillar { display: grid; grid-template-columns: 56px 1fr; gap: 16px; padding: 22px 0; border-bottom: 1px solid var(--line); }
.pillar svg { width: 40px; height: 40px; color: var(--blue); }
.pillar p { color: var(--ink-soft); margin-top: 4px; font-size: .98rem; }
@media (max-width: 820px) { .welcome-grid { grid-template-columns: 1fr; } }

/* Horarios */
.schedule { background: var(--blue-deep); color: var(--on-deep); }
.schedule .eyebrow { color: var(--gold); }
.schedule-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 24px; }
.schedule-head p { color: var(--on-deep-soft); max-width: 44ch; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); margin-top: 48px; border-top: 1px solid rgba(255,255,255,.18); }
.day { padding: 18px 14px 26px; border-right: 1px solid rgba(255,255,255,.12); min-height: 230px; display: flex; flex-direction: column; gap: 10px; }
.day:last-child { border-right: 0; }
.day .dname { font-family: var(--display); font-weight: 700; font-stretch: 120%; letter-spacing: .12em; font-size: .78rem; text-transform: uppercase; color: var(--on-deep-soft); }
.day.on { background: rgba(255,255,255,.06); }
.day.on .dname { color: var(--gold); }
.slot { display: flex; flex-direction: column; gap: 2px; }
.slot .time { font-family: var(--display); font-weight: 800; font-stretch: 105%; font-size: 1.9rem; line-height: 1; font-variant-numeric: tabular-nums; }
.slot .time small { font-size: .9rem; font-weight: 600; }
.slot .what { font-size: .95rem; font-weight: 600; }
.day .rest { color: rgba(255,255,255,.28); font-size: .85rem; }
.schedule-foot { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; justify-content: space-between; margin-top: 40px; padding-top: 28px; border-top: 1px solid rgba(255,255,255,.18); }
.addr { display: flex; gap: 14px; align-items: flex-start; }
.addr svg { width: 26px; height: 26px; flex: none; color: var(--gold); margin-top: 2px; }
.addr strong { display: block; font-size: 1.05rem; }
.addr span { color: var(--on-deep-soft); }
@media (max-width: 900px) {
  .week { grid-template-columns: 1fr; }
  .day { min-height: 0; flex-direction: row; flex-wrap: wrap; align-items: baseline; gap: 10px 24px; border-right: 0; border-bottom: 1px solid rgba(255,255,255,.12); padding: 16px 4px; }
  .day:not(.on) { display: none; }
  .day .dname { width: 100%; }
  .day.on { background: transparent; }
}

/* Tarjetas */
.connect-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin-top: 44px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 28px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card .ico { width: 52px; height: 52px; border-radius: 14px; background: var(--gold-soft); display: grid; place-items: center; color: var(--gold); }
.card .ico svg { width: 28px; height: 28px; }
.card p { color: var(--ink-soft); }
.card a.more { margin-top: auto; padding-top: 8px; font-weight: 700; color: var(--blue); text-decoration: none; }
.card a.more:hover { text-decoration: underline; }
@media (max-width: 860px) { .connect-grid { grid-template-columns: 1fr; } }

/* Galería */
.gallery { background: var(--surface); border-top: 1px solid var(--line); }
.gal-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 20px; }
.gal-nav { display: flex; gap: 10px; }
.gal-nav button { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; font-size: 1.2rem; }
.gal-nav button:hover { border-color: var(--blue); color: var(--blue); }
.track { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; margin-top: 36px; padding-bottom: 12px; scrollbar-width: thin; }
.track figure { margin: 0; flex: 0 0 min(78%, 520px); scroll-snap-align: start; }
.track img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 16px; display: block; background: var(--line); }
.track figcaption { font-size: .9rem; color: var(--ink-soft); margin-top: 8px; }

/* Mensaje */
.message { background: var(--surface); border-block: 1px solid var(--line); }
.msg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(28px, 5vw, 64px); align-items: center; }
.msg-grid > * { min-width: 0; }
.player { position: relative; aspect-ratio: 16/10; max-width: 100%; border-radius: 20px; overflow: hidden; background: linear-gradient(135deg, #0b2a78, #1846b8 60%, #e8a320 140%); color: #fff; display: flex; flex-direction: column; justify-content: space-between; padding: 26px; text-decoration: none; }
.player .series { font-family: var(--display); font-weight: 900; font-stretch: 125%; font-size: clamp(1.6rem, 3.6vw, 2.6rem); line-height: .95; text-transform: uppercase; max-width: 12ch; }
.player .play { width: 68px; height: 68px; border-radius: 50%; background: #e8a320; color: #1b1300; display: grid; place-items: center; align-self: flex-end; }
.player .play svg { width: 26px; height: 26px; margin-left: 4px; }
.player .tag { font-size: .8rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; opacity: .8; }
.msg-meta { color: var(--ink-soft); margin-top: 12px; }
.msg-text { margin-top: 18px; color: var(--ink-soft); max-width: 56ch; }
.msg-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
@media (max-width: 820px) { .msg-grid { grid-template-columns: 1fr; } }

/* Visión */
.vm { display: grid; grid-template-columns: 1fr 1fr; border: 2px solid var(--ink); border-radius: 22px; overflow: hidden; margin-top: 40px; }
.vm > div { padding: clamp(28px, 4vw, 48px); }
.vm > div + div { border-left: 2px solid var(--ink); }
.vm .eyebrow { margin-bottom: 14px; display: block; }
.vm p { font-family: var(--display); font-weight: 600; font-size: clamp(1.25rem, 2.1vw, 1.6rem); line-height: 1.3; }
@media (max-width: 760px) { .vm { grid-template-columns: 1fr; } .vm > div + div { border-left: 0; border-top: 2px solid var(--ink); } }

/* Ministerios */
.min-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 44px; border-top: 2px solid var(--ink); }
.min { padding: 26px 24px 30px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.min .who { font-size: .8rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--blue); }
.min p { color: var(--ink-soft); font-size: .98rem; }
@media (max-width: 860px) { .min-list { grid-template-columns: 1fr 1fr; } }
@media (max-width: 560px) { .min-list { grid-template-columns: 1fr; } }

/* Eventos */
.ev-list { margin-top: 36px; display: grid; gap: 14px; }
.ev { display: grid; grid-template-columns: 92px 1fr auto; gap: 24px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 22px; }
.ev > * { min-width: 0; }
.ev .date { text-align: center; border-right: 1px solid var(--line); padding-right: 20px; }
.ev .date b { display: block; font-family: var(--display); font-weight: 900; font-size: 2.2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.ev .date span { font-size: .78rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--blue); }
.ev p { color: var(--ink-soft); font-size: .95rem; margin-top: 4px; }
.ev .when { font-weight: 600; color: var(--ink-soft); font-size: .92rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.empty { color: var(--ink-soft); padding: 28px; border: 1px dashed var(--line); border-radius: 16px; }
@media (max-width: 640px) { .ev { grid-template-columns: 72px 1fr; } .ev .when { grid-column: 2; white-space: normal; } .ev .date { padding-right: 14px; } }

/* Ofrendar */
.give-band { background: #e8a320; color: #1b1300; }
.give-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 40px; align-items: center; }
.give-grid > * { min-width: 0; }
.give-band .eyebrow { color: #5a3b00; }
.give-band h2 { margin-top: 12px; }
.give-band p.lead { margin-top: 18px; max-width: 52ch; font-size: 1.08rem; }
.give-verse { font-family: var(--verse); font-style: italic; font-size: 1.35rem; line-height: 1.45; border-left: 3px solid #1b1300; padding-left: 22px; }
.give-verse b { display: block; font-family: var(--body); font-style: normal; font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; margin-top: 10px; }
.give-band .btn { margin-top: 26px; background: #1b1300; color: #fff3d6; }
@media (max-width: 820px) { .give-grid { grid-template-columns: 1fr; } }

/* Contacto */
.contact-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin-top: 40px; }
.contact-grid strong { font-size: 1.1rem; word-break: break-word; }
.copy { align-self: flex-start; background: transparent; border: 1px solid var(--line); color: var(--ink); border-radius: 999px; padding: .4em 1em; font: 600 .85rem var(--body); cursor: pointer; }
.copy:hover { border-color: var(--blue); color: var(--blue); }
@media (max-width: 860px) { .contact-grid { grid-template-columns: 1fr; } }
footer { background: var(--blue-deep); color: var(--on-deep-soft); padding-block: 48px 40px; }
.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 24px; align-items: center; }
.social { display: flex; gap: 10px; }
.social a { width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(255,255,255,.2); display: grid; place-items: center; color: var(--on-deep); }
.social a:hover { background: rgba(255,255,255,.1); }
.social svg { width: 20px; height: 20px; }
.foot-bottom { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; margin-top: 28px; font-size: .85rem; }
.foot-bottom a { color: var(--on-deep-soft); }

/* ---------- Panel de administración ---------- */
.admin { min-height: 100vh; background: var(--paper); }
.admin-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--blue-deep); color: var(--on-deep); }
.admin-top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 64px; flex-wrap: wrap; padding-block: 8px; }
.admin-top h1 { font-size: 1.1rem; font-stretch: 115%; text-transform: uppercase; letter-spacing: .04em; }
.admin-top h1 small { display: block; font: 500 .78rem var(--body); letter-spacing: 0; text-transform: none; color: var(--on-deep-soft); margin-top: 2px; }
.admin-top .acts { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.admin-top .btn { padding: .6em 1.1em; font-size: .9rem; }
.status { font-size: .88rem; color: var(--on-deep-soft); }
.status.dirty { color: var(--gold); }
.admin-body { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 32px; padding-block: 32px 80px; }
.admin-side { position: sticky; top: 96px; align-self: start; display: flex; flex-direction: column; gap: 4px; }
.admin-side a { text-decoration: none; padding: .6em .9em; border-radius: 10px; font-weight: 600; color: var(--ink-soft); }
.admin-side a:hover { background: var(--surface); color: var(--ink); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: clamp(20px, 3vw, 32px); display: grid; gap: 20px; scroll-margin-top: 90px; }
.panel + .panel { margin-top: 24px; }
.panel-head { display: flex; justify-content: space-between; align-items: start; gap: 16px; flex-wrap: wrap; }
.panel-head h2 { font-size: 1.6rem; }
.panel-head p { color: var(--ink-soft); font-size: .95rem; margin-top: 6px; max-width: 60ch; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: .82rem; font-weight: 700; color: var(--ink-soft); }
.field input, .field textarea, .field select { width: 100%; font: 500 1rem var(--body); color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: .65em .8em; }
.field textarea { min-height: 80px; resize: vertical; }
.field input:focus, .field textarea:focus, .field select:focus { outline: 2px solid var(--blue); outline-offset: 0; border-color: var(--blue); }

  /* ---------- Panel de administración ---------- */
  var canEdit = false, assets = null, artifactApi = null, dirty = false, saving = false;
  function setDirty() {

  }
  function getK(path) { var p = path.split("."); return state[p[0]][p[1]]; }

  var uid = 0;

  function renderSchedAdmin() {
    var box = $("aSched"); box.textContent = "";

      ]));
    });
  }
  function renderEventsAdmin() {
    var box = $("aEvents"); box.textContent = "";
    if (!state.events.length) box.appendChild(h("p", { class: "empty", text: "No hay eventos. Agrega el primero con el botón de abajo." }));
    state.events.forEach(function (e, i) {

        labelFor(inp(e.date, function (v) { e.date = v; }, "date"), past ? "Fecha (ya pasó)" : "Fecha"),
        labelFor(inp(e.time, function (v) { e.time = v; }), "Hora"),

  function shrink(file) {
    return new Promise(function (resolve) {
      if (!window.createImageBitmap) return resolve(file);
      createImageBitmap(file).then(function (bmp) {
        var max = 2000, sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
        if (sc === 1 && file.size < 2.5e6) return resolve(file);
        var c = document.createElement("canvas"); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
        c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
        c.toBlob(function (b) { resolve(b || file); }, "image/jpeg", 0.86);
      }, function () { resolve(file); });
    });
  }
  function uploadFiles(files) {
    if (!assets) return;
    var list = Array.prototype.filter.call(files, function (f) { return /^image\/(jpeg|png|webp)$/.test(f.type); });
    var msg = $("aUpMsg");
    if (!list.length) { msg.hidden = false; msg.className = "err"; msg.textContent = "Elige fotos en formato JPG, PNG o WEBP."; return; }

      return chain.then(function () {
        return shrink(f).then(function (b) { return assets.upload(b, { type: b.type || f.type }); }).then(function (r) {
          state.photos.push({ id: r.id, alt: "", hero: true, _url: r.url });

        }, function (err) { failed++; console.warn("upload", err && err.code); }).then(function () {

      if (failed) { msg.className = "err"; msg.textContent = done + " fotos subidas. " + failed + " no se pudieron subir (revisa que pesen menos de 20 MB)."; }
      else { msg.className = "uploading"; msg.textContent = done + (done === 1 ? " foto subida." : " fotos subidas.") + " Pulsa “Guardar y publicar” para que aparezcan en el sitio."; }
    });
  }

  function buildDocument() {
    var clean = JSON.parse(JSON.stringify(state));
    clean.photos = clean.photos.map(function (p) { return { id: p.id, alt: p.alt || "", hero: !!p.hero }; });

  function save() {

      if (code === "too_large") { st.textContent = "La página es demasiado grande para guardarse."; }

      else { st.textContent = "No se pudo publicar. Intenta de nuevo."; }
      $("aSave").disabled = false;

    var sP = window.claude.use("assets").catch(function () { return null; });
